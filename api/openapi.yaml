openapi: 3.1.0
info:
  title: Grid Berries API
  version: 1.0.0
  description: |
    REST API for the Grid Berries marketplace. Paths are based on the Spring
    MVC controller mappings. Request and response schemas describe the DTOs
    used by those controller methods.
servers:
  - url: /api/v1
    description: Version 1 API
tags:
  - name: Authentication
  - name: Users
  - name: Seller profile
  - name: Products
  - name: Categories
  - name: Cart
  - name: Orders
  - name: Seller products
  - name: Administration
paths:
  /auth/register:
    post:
      tags: [Authentication]
      operationId: registerUser
      summary: Register an account
      description: Maps a validated registration request to a user and registers that user.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
      responses:
        '201':
          description: Account created
          content:
            text/plain:
              schema:
                type: string
                example: Account created
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Authenticate and return a token pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserAuthRequest'
      responses:
        '200':
          description: Authentication succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserTokenAuthenticationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/refresh:
    post:
      tags: [Authentication]
      operationId: refreshToken
      summary: Exchange a refresh token for a new token pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Tokens refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserTokenAuthenticationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Revoke a refresh token for the current user
      description: Resolves the current user from the authentication context and revokes the supplied refresh token.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '204':
          description: Logout completed
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/me:
    get:
      tags: [Users]
      operationId: getUserProfile
      summary: Get the current user's profile
      description: The controller currently returns null, so this operation has no response body yet.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The controller's declared success response; currently empty because the endpoint is a placeholder.
        '500':
          $ref: '#/components/responses/InternalServerError'

  /seller-profile:
    get:
      tags: [Seller profile]
      operationId: getSellerProfile
      summary: Get the current seller's profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Seller profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerProfileResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Seller profile]
      operationId: createSellerProfile
      summary: Create the current user's seller profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SellerProfileCreateRequest'
      responses:
        '200':
          description: Seller profile created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [Seller profile]
      operationId: updateSellerProfile
      summary: Update the current seller's profile
      description: The request uses the same validated DTO as profile creation; storeName and contactInfo are required.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SellerProfileCreateRequest'
      responses:
        '200':
          description: Seller profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /products:
    get:
      tags: [Products]
      operationId: getProducts
      summary: Search and list products
      description: |
        Filters can be combined. Results are returned in a Spring Data Slice.
        The default page size is 15 and the default sort is createdAt ascending.
        A Slice provides next/previous-page flags but does not include a total
        item count or total page count.
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - name: query
          in: query
          description: Case-insensitive partial match against product title or description.
          schema:
            type: string
        - name: categoryIds
          in: query
          description: Match any of the supplied category IDs. Repeat the parameter to provide multiple IDs.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: integer
              format: int64
        - name: minPrice
          in: query
          description: Minimum product price, inclusive.
          schema:
            type: number
            format: double
        - name: maxPrice
          in: query
          description: Maximum product price, inclusive.
          schema:
            type: number
            format: double
      responses:
        '200':
          description: A page slice of matching products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductSlice'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Products]
      operationId: createProduct
      summary: Create a product for the current seller
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateRequest'
      responses:
        '201':
          description: Product created
          headers:
            Location:
              description: URI of the newly created product
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /products/{productId}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      tags: [Products]
      operationId: getProduct
      summary: Get a product by ID
      security: []
      responses:
        '200':
          description: Product details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Products]
      operationId: updateProduct
      summary: Replace product data
      description: Uses the fully validated product creation DTO as the update request.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateRequest'
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [Products]
      operationId: patchProduct
      summary: Patch product data
      description: The controller currently accepts the same fully validated DTO as product creation.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateRequest'
      responses:
        '200':
          description: Product patched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Products]
      operationId: deleteProduct
      summary: Delete a product owned by the current seller
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Product deleted
          content:
            text/plain:
              schema:
                type: string
                example: Product Deleted
        '500':
          $ref: '#/components/responses/InternalServerError'
  /products/{productId}/moderation:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    patch:
      tags: [Products]
      operationId: patchProductStatus
      summary: Change a product's moderation status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductModerateStatusRequest'
      responses:
        '200':
          description: Product moderation status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /seller:
    get:
      tags: [Seller products]
      operationId: getSellerProducts
      summary: List products belonging to the current seller
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Seller's products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /categories:
    get:
      tags: [Categories]
      operationId: getRootCategories
      summary: List root categories
      security: []
      responses:
        '200':
          description: Root categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Categories]
      operationId: createCategory
      summary: Create a category
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '200':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /categories/parent/{parentCategoryId}:
    parameters:
      - name: parentCategoryId
        in: path
        required: true
        description: ID of the parent category.
        schema:
          type: integer
          format: int64
    get:
      tags: [Categories]
      operationId: getChildrenCategories
      summary: List child categories
      security: []
      responses:
        '200':
          description: Categories belonging to the specified parent
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /categories/{categoryId}:
    parameters:
      - name: categoryId
        in: path
        required: true
        description: Category ID.
        schema:
          type: integer
          format: int64
    get:
      tags: [Categories]
      operationId: getCategory
      summary: Get a category by ID
      security: []
      responses:
        '200':
          description: Category details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [Categories]
      operationId: patchCategory
      summary: Update a category
      description: The request requires a name even though this operation uses PATCH.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '200':
          description: Category updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Categories]
      operationId: deleteCategory
      summary: Delete a category
      security: []
      responses:
        '204':
          description: Category deleted
        '500':
          $ref: '#/components/responses/InternalServerError'

  /cart:
    get:
      tags: [Cart]
      operationId: getCart
      summary: Get the current user's cart
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /cart/items:
    post:
      tags: [Cart]
      operationId: addCartItem
      summary: Add a product to the current user's cart
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCartItemRequest'
      responses:
        '200':
          description: Cart after adding the item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /cart/items/{itemId}:
    parameters:
      - name: itemId
        in: path
        required: true
        description: Cart item ID.
        schema:
          type: integer
          format: int64
    patch:
      tags: [Cart]
      operationId: patchCartItemQuantity
      summary: Set a cart item's quantity
      security:
        - bearerAuth: []
      parameters:
        - name: quantity
          in: query
          required: true
          description: New quantity; must be at least 1.
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Cart after updating the quantity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Cart]
      operationId: removeCartItem
      summary: Remove an item from the current user's cart
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Cart item removed
        '500':
          $ref: '#/components/responses/InternalServerError'
  /cart/clear:
    delete:
      tags: [Cart]
      operationId: clearCart
      summary: Remove all items from the current user's cart
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Cart cleared
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders:
    get:
      tags: [Orders]
      operationId: getBuyerOrders
      summary: List the current user's orders
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Order history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Orders]
      operationId: placeOrder
      summary: Place an order
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOrderRequest'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /orders/orders/{orderId}:
    parameters:
      - name: orderId
        in: path
        required: true
        description: Order ID.
        schema:
          type: integer
          format: int64
    get:
      tags: [Orders]
      operationId: getOrder
      summary: Get an order by ID
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [Orders]
      operationId: patchOrderStatus
      summary: Change an order's status
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: true
          description: Requested order status.
          schema:
            $ref: '#/components/schemas/OrderStatus'
      responses:
        '200':
          description: Order status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /orders/seller/orders:
    get:
      tags: [Orders]
      operationId: getSellerOrders
      summary: List orders containing products from the current seller
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Incoming seller orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin:
    get:
      tags: [Administration]
      operationId: getUserByEmailForModeration
      summary: Get a user for moderation by email
      security:
        - bearerAuth: []
      parameters:
        - name: userEmail
          in: query
          required: true
          description: Email address of the user to retrieve.
          schema:
            type: string
            format: email
      responses:
        '200':
          description: User moderation details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserModerationResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        description: User ID.
        schema:
          type: integer
          format: int64
    patch:
      tags: [Administration]
      operationId: moderateUser
      summary: Update a user's moderation fields
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserModerationRequest'
      responses:
        '200':
          description: Updated user moderation details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserModerationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/product/{productId}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    patch:
      tags: [Administration]
      operationId: moderateProduct
      summary: Update product fields as an administrator
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdateRequest'
      responses:
        '200':
          description: Updated product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      description: Zero-based page number. Defaults to 0.
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: Number of products per page. Defaults to 15.
      schema:
        type: integer
        minimum: 1
        default: 15
    Sort:
      name: sort
      in: query
      description: Sort property and optional direction, for example sort=price,desc. May be repeated.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    ProductId:
      name: productId
      in: path
      required: true
      description: Product ID.
      schema:
        type: integer
        format: int64
  responses:
    BadRequest:
      description: Invalid request or validation failure.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalServerError:
      description: Unexpected server error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Role:
      type: string
      enum: [BUYER, SELLER, ADMIN]
    ProductStatus:
      type: string
      enum: [PENDING_MODERATION, ACTIVE, SUSPENDED]
    OrderStatus:
      type: string
      enum: [CREATED, IN_PROCESSING, SHIPPED, COMPLETED, CANCELLED]
    UserRegistrationRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 100
        password:
          type: string
          description: Must include uppercase and lowercase letters and a digit.
        passwordConfirm:
          type: string
          description: When supplied, must match password.
        passwordsIsMatch:
          type: boolean
          readOnly: true
        role:
          $ref: '#/components/schemas/Role'
          default: BUYER
    UserAuthRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 100
        password:
          type: string
          description: Must include uppercase and lowercase letters and a digit.
    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 1
          maxLength: 255
    UserTokenAuthenticationResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
    UserProfileResponse:
      type: object
      properties:
        email:
          type: string
    UserModerationRequest:
      type: object
      description: All fields are optional; provided values are updated.
      properties:
        email:
          type: string
          format: email
          maxLength: 100
        isActive:
          type: boolean
        password:
          type: string
          description: If supplied, must include uppercase and lowercase letters and a digit.
        role:
          $ref: '#/components/schemas/Role'
    UserModerationResponse:
      type: object
      properties:
        email:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
    SellerProfileCreateRequest:
      type: object
      required: [storeName, contactInfo]
      properties:
        storeName:
          type: string
          minLength: 2
          maxLength: 100
        storeDescription:
          type: string
          maxLength: 1000
        contactInfo:
          type: string
          minLength: 1
          maxLength: 100
    SellerProfileResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        storeName:
          type: string
        storeDescription:
          type: string
        contactInfo:
          type: string
        createdAt:
          type: string
          format: date-time
    ProductCreateRequest:
      type: object
      required: [title, price, stockQuantity, categoryIds]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 2000
        price:
          type: number
          format: double
          minimum: 0
        stockQuantity:
          type: integer
          minimum: 0
        imageUrl:
          type: string
          format: uri
        categoryIds:
          type: array
          minItems: 1
          items:
            type: integer
            format: int64
    ProductUpdateRequest:
      type: object
      description: Optional fields accepted when updating a product through the admin controller.
      properties:
        title:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 2000
        price:
          type: number
          format: double
          minimum: 0
        stockQuantity:
          type: integer
          minimum: 0
        imageUrl:
          type: string
          format: uri
        categoryIds:
          type: array
          items:
            type: integer
            format: int64
    ProductModerateStatusRequest:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ProductStatus'
    ProductResponse:
