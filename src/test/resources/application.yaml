spring:
  application:
    name: Test app
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true


jwt:
  ttl: 120m
  refresh-token:
    expiration: 1440m
  private-key: classpath:${JWT_PRIVATE_KEY:jwt/app.key}
  public-key: classpath:${JWT_PUBLIC_KEY:jwt/app.pub}