$kind: http-request
name: Update Category
method: PATCH
url: '{{base_url}}/api/v1/categories/{{categoryId}}'
headers:
  Content-Type: application/json
pathVariables:
  - key: categoryId
    value: '1'
    description: 'Category ID'
body:
  type: json
  content: |-
    {
      "name": "Fresh Berries",
      "description": "Updated description"
    }
order: 5000
