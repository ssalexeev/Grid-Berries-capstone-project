$kind: http-request
name: Update Seller Profile
method: PATCH
url: '{{base_url}}/api/v1/seller-profile'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{access_token}}'
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "storeName": "Berry Store",
      "storeDescription": "We sell the freshest berries",
      "contactInfo": "contact@berrystore.com"
    }
