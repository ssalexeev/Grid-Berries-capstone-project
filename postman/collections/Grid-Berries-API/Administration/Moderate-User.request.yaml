$kind: http-request
name: Moderate User
method: PATCH
url: '{{base_url}}/api/v1/admin/{{userId}}'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{access_token}}'
headers:
  Content-Type: application/json
pathVariables:
  - key: userId
    value: '1'
    description: 'User ID'
body:
  type: json
  content: |-
    {
      "email": "user@example.com",
      "isActive": true,
      "role": "BUYER"
    }
order: 2000
